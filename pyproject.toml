[project]
name = "judge-agreement-harness"
version = "0.1.0"
description = "Validation harness for LLM-as-judge pipelines: human agreement, bias probes, CI gate"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools]
packages = ["src", "eval"]

[tool.ruff]
line-length = 100
